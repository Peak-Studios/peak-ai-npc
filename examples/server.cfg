# Minimal local configuration. Keep the secret out of source control in production.
sv_licenseKey "REPLACE_WITH_YOUR_KEYMASTER_LICENSE_KEY"
set peak_ai_npc_gateway_url "http://127.0.0.1:8787"
set peak_ai_npc_gateway_secret "replace-with-a-long-random-secret"
set peak_ai_npc_server_id "local-development"

# Required by the resource manifest.
set onesync on

# Start the dependencies for the shipped QBCore defaults first.
ensure qb-core
ensure qb-inventory
ensure qb-target
ensure qb-shops
ensure peak-ai-npc
